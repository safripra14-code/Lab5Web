<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum Java Script</title>
</head>
<body>
    <h1>Pengenalan Awal</h1>
    <p id="pesan">Konten Awal</p>
    <!-- Latihan 6 -->
    <label for="bilangan">Masukkan bilangan bulat:</label>
    <input type="number" id="bilangan" step="1">
    <button type="button" onclick="cekBilangan()">Periksa</button>
    <p id="hasilBilangan"></p>
    <!-- Latihan 7 -->
    <button type="button" onclick="ubahWarnaLatar('lightgreen')">Latar Hijau</button>
    <button type="button" onclick="ubahWarnaLatar('white')">Latar Putih</button>
    <button type="button" onclick="ubahWarnaLatar('lightyellow')">Latar Kuning</button>
    <!-- Latihan 8 -->
    <h3>Daftar Menu Makanan</h3>
    <label><input type="checkbox" class="menu" value="5000"> Ayam Goreng — Rp5.000</label><br>
    <label><input type="checkbox" class="menu" value="500"> Tempe — Rp500</label><br>
    <label><input type="checkbox" class="menu" value="2500"> Telur Dadar — Rp2.500</label><br>
    <p>Total: Rp<span id="total">0</span></p>

    <!-- Eksperimen mandiri 8 -->
    <h2>Cek Bilangan Genap</h2>

    <label for="angka">Masukkan angka:</label>
    <input type="number" id="angka" placeholder="Contoh: 8">

    <button onclick="cekInput()">Periksa</button>

    <p id="hasil"></p>

        <h3>Daftar Menu Makanan</h3>
    <label><input type="checkbox" class="menu2" value="5000"> Ayam Goreng — Rp5.000</label><br>
    <label><input type="checkbox" class="menu2" value="500"> Tempe — Rp500</label><br>
    <label><input type="checkbox" class="menu2" value="2500"> Telur Dadar — Rp2.500</label><br>
    <p>Total: Rp<span id="total2">0</span></p>

    <!-- Eksperimen mandiri 11 -->
         <h1>Produk Laptop</h1>
    <p>Nama: Laptop ASUS</p>
    <p>Harga: Rp7.500.000</p>

    <button id="tombol" onclick="ubahTampilan()">
        Lihat Deskripsi
    </button>

    <p id="deskripsi" style="display: none;">
        Laptop ASUS memiliki performa yang baik untuk belajar,
        bekerja, dan menjalankan aplikasi sehari-hari.
    </p>



    <script src="script.js"></script>
</body>
</html>
